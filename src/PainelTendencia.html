<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#203047;font:14px Arial,sans-serif}header{padding:18px 22px;background:#fff;border-bottom:1px solid #dce3ed}h1{font-size:22px;margin:0 0 6px}p{line-height:1.5}small,.muted{color:#617086}button,input,select{font:inherit;border:1px solid #cbd5e1;border-radius:7px;padding:9px;background:white;color:#203047}button{cursor:pointer}button:hover{background:#edf3ff}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #789cf3}button:disabled{opacity:.5;cursor:default}.filters{display:grid;grid-template-columns:1fr 1.3fr 1fr 1fr auto;gap:10px;padding:16px 22px}label{font-size:12px;display:grid;gap:5px}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;padding:0 22px 20px}.panel{background:white;border:1px solid #dce3ed;border-radius:10px;padding:16px;min-width:0}.scroll{max-height:410px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px 6px;border-bottom:1px solid #e7ecf2;text-align:right}th{position:sticky;top:0;background:#f7f9fc}th:first-child,td:first-child{text-align:left}.product{border:0;padding:0;background:none;text-align:left;color:#244ea7;overflow-wrap:anywhere}.selected{background:#eef4ff}.badge{display:inline-block;padding:5px 7px;border-radius:5px;background:#eef1f5;font-size:11px}.up{background:#e5f4ed;color:#176443}.down{background:#fff0e5;color:#8a4713}.warning{background:#fff4da;border-left:3px solid #d59318;padding:10px;font-size:12px;margin:12px 0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#f5f7fb;padding:12px;border-radius:7px}.card strong{display:block;font-size:24px;margin-top:8px}.card small{display:block;margin-top:6px}.wide{grid-column:1/-1}h2{font-size:18px;margin:0 0 8px;overflow-wrap:anywhere}.pager{display:flex;align-items:center;justify-content:space-between;margin-top:12px}#message{padding:0 22px;color:#9a3412}#detail{max-height:520px;overflow:auto}@media(max-width:800px){.layout{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>Como está a velocidade de venda?</h1><small id="coverage">Consulta dos resultados já gerados. Para recalcular, use Atualizar Análises na planilha.</small></header>
<div class="filters">
<label>Fornecedor<select id="supplier"><option value="">Todos</option></select></label>
<label>Código ou nome<input id="search" type="search" placeholder="Buscar produto"></label>
<label>Tendência<select id="trend"><option value="">Todas</option></select></label>
<label>Ordenar<select id="sort"><option value="down">Maiores quedas</option><option value="up">Maiores aumentos</option><option value="name">Produto A–Z</option></select></label>
<button id="reload">Recarregar dados</button>
</div>
<p id="message" role="status" aria-live="polite"></p>
<main class="layout"><section class="panel"><div id="count" class="muted"></div><div class="scroll"><table><thead><tr><th>Produto</th><th>Anterior<br>qtd./dia</th><th>Recente<br>qtd./dia</th><th>Variação</th><th>Tendência</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button id="prev">Anterior</button><span id="page"></span><button id="next">Próxima</button></div></section><section class="panel" id="detail" aria-live="polite">Selecione um produto para comparar os períodos.</section></main>
<script>
const $=id=>document.getElementById(id);
let data=[],filtered=[],page=0,selected=null;
const size=30;
const labels={ACELERANDO:'Acelerando',DESACELERANDO:'Desacelerando',ESTAVEL:'Estável',SEM_MOVIMENTO:'Sem movimento',DADOS_INCOMPLETOS:'Dados incompletos',SEM_BASE:'Sem base'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=v=>v===''||v===null||v===undefined;
const invalidNumber=v=>blank(v)||!Number.isFinite(Number(v));
const num=v=>invalidNumber(v)?'—':Number(v).toLocaleString('pt-BR',{maximumFractionDigits:2});
const pct=v=>invalidNumber(v)?'Sem base':Number(v).toLocaleString('pt-BR',{style:'percent',maximumFractionDigits:1,signDisplay:'exceptZero'});
const norm=v=>String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const badge=v=>'<span class="badge '+(v==='ACELERANDO'?'up':v==='DESACELERANDO'?'down':'')+'">'+esc(labels[v]||v)+'</span>';
function options(id,entries){const old=$(id).value;$(id).replaceChildren(new Option(id==='supplier'?'Todos':'Todas',''));entries.forEach(([key,value])=>$(id).add(new Option(value,key)));$(id).value=old;if(!$(id).value)$(id).value='';}
function load(){ $('reload').disabled=true;$('message').textContent='Carregando…';google.script.run.withSuccessHandler(items=>{data=items.map((r,i)=>({...r,_id:i}));selected=null;options('supplier',[...new Map(data.map(r=>[String(r.fornecedor_cod),r.fornecedor_cod+' — '+r.fornecedor])).entries()].sort((a,b)=>a[1].localeCompare(b[1])));options('trend',[...new Set(data.map(r=>r.tendencia_venda))].sort().map(v=>[v,labels[v]||v]));atualizarCobertura();$('reload').disabled=false;$('message').textContent=items.length?'':'Nenhum resultado. Execute Atualizar Análises na planilha.';filter();}).withFailureHandler(error=>{$('reload').disabled=false;$('message').textContent=error.message||String(error);}).obterDadosPainelTendencia();}
function filter(){const q=norm($('search').value);filtered=data.filter(r=>(!$('supplier').value||String(r.fornecedor_cod)===$('supplier').value)&&(!$('trend').value||r.tendencia_venda===$('trend').value)&&norm(r.produto_cod+' '+r.produto).includes(q));const order=$('sort').value;filtered.sort((a,b)=>{if(order==='name')return String(a.produto).localeCompare(String(b.produto),'pt-BR');const av=a.variacao_vs_anterior,bv=b.variacao_vs_anterior;if(invalidNumber(av)||invalidNumber(bv))return Number(invalidNumber(av))-Number(invalidNumber(bv));return order==='up'?bv-av:av-bv;});page=0;if(!filtered.some(r=>r._id===selected))selected=filtered[0]?._id??null;render();}
function render(){$('count').textContent=filtered.length+' registros fornecedor × produto';$('rows').innerHTML=filtered.slice(page*size,(page+1)*size).map(r=>'<tr class="'+(r._id===selected?'selected':'')+'"><td><button class="product" data-id="'+r._id+'">'+esc(r.produto_cod+' — '+r.produto)+'</button><br><small>'+esc(r.fornecedor)+'</small></td><td>'+num(r.media_dia_anterior)+'</td><td>'+num(r.media_dia_recente)+'</td><td>'+pct(r.variacao_vs_anterior)+'</td><td>'+badge(r.tendencia_venda)+'</td></tr>').join('');$('page').textContent=filtered.length?(page+1)+' / '+Math.ceil(filtered.length/size):'Sem resultados';$('prev').disabled=page===0;$('next').disabled=(page+1)*size>=filtered.length;detail();}
function card(label,value,extra){return '<div class="card"><small>'+esc(label)+'</small><strong>'+esc(value)+'</strong><small>'+esc(extra||'')+'</small></div>';}
function atualizarCobertura(){const r=data[0];if(!r){$('coverage').textContent='Não há dados de tendência para exibir.';return;}$('coverage').textContent='CONFIG: '+r.inicio_periodo_analise+' a '+r.fim_periodo_analise+' • Vendas consideradas: '+(r.inicio_periodo_efetivo_vendas||'—')+' a '+(r.fim_periodo_efetivo_vendas||'—')+' ('+num(r.dias_periodo_efetivo_vendas)+' dias) • '+String(r.status_dados||'').replace(/_/g,' ');}
function detail(){const r=data.find(r=>r._id===selected);if(!r){$('detail').textContent='Nenhum produto corresponde aos filtros.';return;}const range=(a,b)=>String(r[a]||'—')+' a '+String(r[b]||'—');const aviso=r.status_dados!=='DADOS_ATUALIZADOS'?'Atenção: '+String(r.status_dados||'').replace(/_/g,' ')+'. As médias e janelas foram recalculadas apenas até a última data disponível.':'';$('detail').innerHTML='<h2>'+esc(r.produto_cod+' — '+r.produto)+'</h2><small>'+esc(r.fornecedor_cod+' — '+r.fornecedor)+'</small><p>'+badge(r.tendencia_venda)+'</p>'+(aviso?'<div class="warning">'+esc(aviso)+'</div>':'')+'<div class="cards">'+card('Período efetivo de vendas',range('inicio_periodo_efetivo_vendas','fim_periodo_efetivo_vendas'),invalidNumber(r.dias_periodo_efetivo_vendas)?'Período não calculado':num(r.dias_periodo_efetivo_vendas)+' dias considerados')+card('Período solicitado na CONFIG',range('inicio_periodo_analise','fim_periodo_analise'))+card('14 dias anteriores',num(r.media_dia_anterior)+' qtd./dia',range('inicio_janela_anterior','fim_janela_anterior')+' • '+num(r.qtd_venda_anterior)+' vendidos')+card('14 dias recentes',num(r.media_dia_recente)+' qtd./dia',range('inicio_janela_recente','fim_janela_recente')+' • '+num(r.qtd_venda_recente)+' vendidos')+card('Variação contra a janela anterior',pct(r.variacao_vs_anterior))+card('Média do período efetivo',num(r.media_dia_periodo)+' qtd./dia')+card('Recente × média efetiva',pct(r.variacao_vs_periodo))+card('Saldo de movimentação',num(r.saldo_movimentacao))+card('Cobertura pela média geral',num(r.cobertura_dias_periodo)+' dias')+card('Cobertura pelo ritmo recente',invalidNumber(r.cobertura_dias_recente)?'Não calculável':num(r.cobertura_dias_recente)+' dias')+'</div><div class="warning">Cobertura estimada pelo saldo do período; não representa estoque físico. As quantidades seguem a atribuição por fornecedor da análise. A cobertura ainda depende da análise principal, cuja CONFIG pode ser mais ampla que os dados efetivamente importados.</div><small>Valores vazios aparecem como “—” ou “Sem base”, nunca como zero. Este painel não recalcula os indicadores.</small>';}
['supplier','trend','sort'].forEach(id=>$(id).addEventListener('change',filter));$('search').addEventListener('input',filter);$('reload').addEventListener('click',load);$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('rows').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b){selected=Number(b.dataset.id);render();}});load();
</script>
</body>
</html>
